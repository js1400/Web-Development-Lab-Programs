<html>
<head>
    <title>JQuery User Input Example</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script> 
</head>
<body>
    <div class="container">
        <h1>JQuery Interactions with User Input</h1>
        <p id="myP">This is an existing paragraph.</p>
        <input type="text" id="Pinput" placeholder="Enter text to add to paragraph">
        <button id="appendPBtn">Add to Paragraph</button>

        <ul id="myList">
            <li>Item 1</li>
            <li>Item 2</li>
        </ul>
        <input type="text" id="Linput" placeholder="Enter text to add to list">
        <button id="appendLBtn">Add to List</button>

        <div class="animatedDiv">Click Me</div>
    </div>
</body>
</html>
