<html>
    <head>
        <title>College Chess Tournament</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>CHESS TOURNAMENT</h1>
        <h3>Our college is organizing a chess tournament for the students.</h3>
        <hr>
        <P>Students can register for the tournament by filling out the registration form below. The tournament will be held in the college auditorium on 21st September 2026.</p>
        <form action="#" method="post" enctype="multipart/form-data">
            <table>
                <tr>
                    <td><label for="fname">First Name:</label></td>
                    <td><input type="text" id="fname" name="fname" placeholder="Enter your First Name" required></td>
                </tr>
                <tr>
                    <td><label for="lname">Last Name:</label></td>
                    <td><input type="text" id="lname" name="lname" placeholder="Enter your Last Name"></td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" name="email" placeholder="Enter valid email address" required></td>
                </tr>
                <tr>
                    <td><label for="phone">Phone Number:</label></td>
                    <td><input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" required></td>
                </tr>
                
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td><input type="password" id="password" name="password" placeholder="Enter your Password" required></td>
                </tr>

                <tr>
                    <td><label for="confirm_password">Confirm Password:</label></td>
                    <td><input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your Password" required></td>
                </tr>

                <tr>
                    <td><label for="format">Tournament Format:</label></td>
                    <td><select id="format" name="format" required>
                        <option value="">Select the format</option>
                        <option value="Rapid">Rapid</option>
                        <option value="Blitz">Blitz</option>
                        <option value="Bullet">Bullet</option>
                    </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="gender">Gender:</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </td>
                </tr>

                
                <tr>
                    <td><label for="address">Address:</label></td>
                    <td><textarea id="address" name="address" placeholder="Enter your Address" required></textarea></td>
                </tr>
                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td><input type="date" id="dob" name="dob"required></td>
                </tr>
                
                <tr>
                    <td><label for="file">Upload your ID Proof:</label></td>
                    <td><input type="file" id="file" name="file" accept=".jpeg,.png" required></td>
                </tr>
                <tr>
                    <td><label for="text">Terms and Conditions:</label></td>
                    <td><input type="checkbox" id="text" name="text" required>I agree to the terms and conditions</td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" value="Register"> &nbsp;
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
    </body>
</html>
